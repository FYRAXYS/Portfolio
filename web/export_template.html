<!DOCTYPE html>
<html lang="en">
	<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>FYRAXYS | PORTFOLIO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
		
    <style>

        html, body, #canvas {
            margin: 0;
            padding: 0;
            border: 0;
        }

        body {
            color: white;
            background-color: #0d1f0f;
            overflow: hidden;
            touch-action: none;
        }

        #canvas {
            display: block;
        }

        #canvas:focus {
            outline: none;
        }

        /* ─── LOADING SCREEN ─────────────────────────────────────── */

        #custom {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 100;
            overflow: hidden;

            opacity: 1;
            transition: opacity 1.2s ease-out;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #custom.fade-out-html {
            opacity: 0;
            pointer-events: none;
        }

        /* Sky gradient */
        #sky {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                #e8f4f0 0%,
                #c5dfd4 18%,
                #9ec9b8 36%,
                #6aaa8f 55%,
                #3d7a5e 72%,
                #1e4d35 88%,
                #0d2919 100%
            );
        }

        /* Parallax SVG layers */
        .parallax-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* Mist layers */
        .mist {
            position: absolute;
            left: -20%;
            width: 140%;
            height: 80px;
            border-radius: 50%;
            opacity: 0;
            animation: mistDrift 8s ease-in-out infinite;
        }
        .mist-1 { bottom: 38%; background: radial-gradient(ellipse, rgba(255,255,255,0.18) 0%, transparent 70%); animation-delay: 0s; animation-duration: 10s; }
        .mist-2 { bottom: 28%; background: radial-gradient(ellipse, rgba(220,240,235,0.22) 0%, transparent 70%); animation-delay: 3s; animation-duration: 12s; height: 100px; }
        .mist-3 { bottom: 20%; background: radial-gradient(ellipse, rgba(200,230,220,0.15) 0%, transparent 70%); animation-delay: 6s; animation-duration: 9s; }

        @keyframes mistDrift {
            0%   { opacity: 0; transform: translateX(0); }
            20%  { opacity: 1; }
            80%  { opacity: 0.8; }
            100% { opacity: 0; transform: translateX(8%); }
        }

        /* Subtle floating animation for layers */
        @keyframes layerFloat {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-4px); }
        }

        /* Stars */
        #stars {
            position: absolute;
            inset: 0;
            opacity: 0.6;
        }

        /* Birds */
        #birds {
            position: absolute;
            top: 14%;
            right: 15%;
            opacity: 0.7;
            animation: birdsFloat 6s ease-in-out infinite;
        }
        @keyframes birdsFloat {
            0%, 100% { transform: translate(0, 0); }
            50%       { transform: translate(-12px, -8px); }
        }

        /* Snow particles */
        .snowflake {
            position: absolute;
            top: -10px;
            background: rgba(255,255,255,0.85);
            border-radius: 50%;
            animation: snowFall linear infinite;
            pointer-events: none;
        }
        @keyframes snowFall {
            0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.9; }
            100% { transform: translateY(110vh) translateX(30px) rotate(360deg); opacity: 0; }
        }

        /* ─── UI OVERLAY ─────────────────────────────────────────── */

        #ui-overlay {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            text-align: center;
            padding: 0 2rem;
        }

        #logo-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            font-weight: 600;
            letter-spacing: 0.35em;
            color: #e8f5ee;
            text-shadow:
                0 0 40px rgba(80, 200, 140, 0.5),
                0 2px 6px rgba(0,0,0,0.6);
            opacity: 0;
            animation: titleReveal 1.6s ease-out 0.4s forwards;
        }

        #logo-sub {
            font-family: 'Raleway', sans-serif;
            font-size: clamp(0.65rem, 1.5vw, 0.85rem);
            font-weight: 300;
            letter-spacing: 0.6em;
            color: rgba(200, 235, 215, 0.75);
            text-transform: uppercase;
            opacity: 0;
            animation: titleReveal 1.6s ease-out 0.9s forwards;
        }

        @keyframes titleReveal {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Progress bar */
        #progress-container {
            width: clamp(160px, 30vw, 280px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: titleReveal 1.6s ease-out 1.3s forwards;
        }

        #status-progress {
            width: 100%;
            height: 2px;
            -webkit-appearance: none;
            appearance: none;
            border: none;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }

        #status-progress::-webkit-progress-bar {
            background: rgba(255,255,255,0.12);
            border-radius: 2px;
        }

        #status-progress::-webkit-progress-value {
            background: linear-gradient(90deg, #5bc49a, #a8e6cb);
            border-radius: 2px;
            transition: width 0.4s ease;
        }

        #status-progress::-moz-progress-bar {
            background: linear-gradient(90deg, #5bc49a, #a8e6cb);
            border-radius: 2px;
        }

        #loading-label {
            font-family: 'Raleway', sans-serif;
            font-size: 0.72rem;
            font-weight: 300;
            letter-spacing: 0.25em;
            color: rgba(180, 220, 200, 0.65);
            text-transform: uppercase;
        }

        /* Notice (error state) */
        #status-notice {
            display: none;
            background: rgba(20, 50, 30, 0.85);
            border: 1px solid rgba(100, 200, 140, 0.3);
            border-radius: 6px;
            color: #c8e6d0;
            font-family: 'Raleway', sans-serif;
            font-size: 0.85rem;
            line-height: 1.5;
            padding: 1rem 1.25rem;
            max-width: 380px;
            text-align: center;
        }

        /* Bottom links */
        #custom-bottom-text {
            position: absolute;
            bottom: 18px;
            width: 100%;
            text-align: center;
            font-family: 'Raleway', sans-serif;
            font-size: 0.72rem;
            font-weight: 300;
            letter-spacing: 0.12em;
            color: rgba(180, 220, 200, 0.5);
            z-index: 10;
            pointer-events: all;
        }

        #custom-bottom-text p { margin: 3px 0; }

        #custom-bottom-text a {
            color: rgba(140, 220, 170, 0.8);
            text-decoration: none;
            border-bottom: 1px solid rgba(140,220,170,0.3);
            transition: color 0.2s, border-color 0.2s;
        }
        #custom-bottom-text a:hover {
            color: #a8e6c0;
            border-color: rgba(168,230,192,0.6);
        }

        /* Hidden status overlay (legacy godot elements) */
        #status {
            display: none;
        }

    </style>

	</head>

	<body>

                <!-- Snow caps clipped to mountain shape -->

            <!-- Birds -->

            <!-- Mist layers -->

            <!-- ─── UI CENTER ──────────────────────────────────────── -->

                <div id="logo-title">FYRAXYS</div>

        </div>

        <canvas id="canvas">

        </canvas>

        <noscript>
            Oups&nbsp;! Il semblerait que votre navigateur ne supporte pas JavaScript.
            Consultez la <a href="https://github.com/FYRAXYS" target="_blank">version statique</a>
        </noscript>

        <!-- Snow particles (JS-generated) -->
        <script>
        (function() {
            const screen = document.getElementById('custom');
            for (let i = 0; i < 28; i++) {
                const s = document.createElement('div');
                s.className = 'snowflake';
                const size = Math.random() * 3 + 1;
                s.style.cssText = [
                    'width:' + size + 'px',
                    'height:' + size + 'px',
                    'left:' + Math.random() * 100 + '%',
                    'animation-duration:' + (Math.random() * 10 + 8) + 's',
                    'animation-delay:' + (Math.random() * 12) + 's',
                    'opacity:' + (Math.random() * 0.5 + 0.3)
                ].join(';');
                screen.appendChild(s);
            }
        })();
        </script>

        <script src="index.js"></script>
        <script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":13249744,"index.wasm":1589584},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
    const statusProgress = document.getElementById('status-progress');
    const statusNotice   = document.getElementById('status-notice');
    const loadingLabel   = document.getElementById('loading-label');

    let initializing = true;
    let statusMode = '';

    function setStatusMode(mode) {
        if (statusMode === mode || !initializing) return;

        if (mode === 'hidden') {
            const loadingEl = document.getElementById('custom');
            if (loadingEl) {
                void loadingEl.offsetWidth;
                loadingEl.classList.add('fade-out-html');
                setTimeout(() => { loadingEl.style.display = 'none'; }, 1200);
            }
            return;
        }

        if (mode === 'progress') {
            statusProgress.style.display = 'block';
            if (loadingLabel) loadingLabel.textContent = 'Chargement en cours…';
        }
        if (mode === 'notice') {
            statusNotice.style.display = 'block';
        }
        statusMode = mode;
    }

    function setStatusNotice(text) {
        while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
        text.split('\n').forEach((line) => {
            statusNotice.appendChild(document.createTextNode(line));
            statusNotice.appendChild(document.createElement('br'));
        });
    }

    function displayFailureNotice(err) {
        console.error(err);
        if (err instanceof Error)      setStatusNotice(err.message);
        else if (typeof err === 'string') setStatusNotice(err);
        else                           setStatusNotice('An unknown error occurred.');
        setStatusMode('notice');
        initializing = false;
    }

    const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

    if (missing.length !== 0) {
        if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
            let swPromise;
            try { swPromise = navigator.serviceWorker.getRegistration(); }
            catch (err) { swPromise = Promise.reject(new Error('Service worker registration failed.')); }
            Promise.race([
                swPromise.then((reg) => {
                    if (reg != null) return Promise.reject(new Error('Service worker already exists.'));
                    return reg;
                }).then(() => engine.installServiceWorker()),
                new Promise((resolve) => { setTimeout(() => resolve(), 2000); }),
            ]).then(() => { window.location.reload(); })
              .catch((err) => { console.error('Error while registering service worker:', err); });
        } else {
            const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
            displayFailureNotice(missingMsg + missing.join('\n'));
        }
    } else {
        setStatusMode('progress');
        engine.startGame({
            'onProgress': function (current, total) {
                if (current > 0 && total > 0) {
                    statusProgress.value = current;
                    statusProgress.max   = total;
                    const pct = Math.min(100, Math.round((current / total) * 100));
                    if (loadingLabel) loadingLabel.textContent = 'Chargement… ' + pct + '%';
                } else {
                    statusProgress.removeAttribute('value');
                    statusProgress.removeAttribute('max');
                    if (loadingLabel) loadingLabel.textContent = 'Chargement en cours…';
                }
            },
        }).then(() => { setStatusMode('hidden'); }, displayFailureNotice);
    }
}());
        </script>
